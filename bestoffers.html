
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10121c">

  <title>Dating Links</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 14px;
      font-family: Arial, sans-serif;
      background: #10121c;
      color: #ffffff;
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      padding: 16px 5px;
    }

    .header h1 {
      color: #ff6b91;
      font-size: 25px;
      margin: 0 0 9px;
    }

    .header p {
      color: #c5c7d4;
      font-size: 14px;
      line-height: 1.5;
      margin: 0;
    }

    .counter {
      background: #202334;
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .links {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 54px;
      padding: 12px 5px;
      border-radius: 11px;
      background: #292d42;
      border: 1px solid #414760;
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.2s, border-color 0.2s;
    }

    /* ক্লিক করা লিংকের রং */
    .link-btn.clicked {
      background: #168344;
      border-color: #4ade80;
      color: #ffffff;
    }

    .link-btn:active {
      opacity: 0.8;
    }

    .footer {
      text-align: center;
      margin: 22px 0 10px;
      color: #9297aa;
      font-size: 12px;
      line-height: 1.7;
    }

    @media (min-width: 390px) {
      .links {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (min-width: 600px) {
      .links {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <header class="header">
      <h1>Dating Links</h1>
      <p>লিংকে ক্লিক করো। ক্লিক করা লিংক সবুজ হয়ে থাকবে।</p>
    </header>

    <div class="counter" id="counter">
      মোট ৫০টি লিংক
    </div>

    <nav class="links" id="links" aria-label="Dating links">
    </nav>

    <footer class="footer">
      শুধুমাত্র ১৮ বছর বা তার বেশি বয়সীদের জন্য।
    </footer>

  </main>

  <script>
    const baseUrl =
      "https://luckynowforever.com/P8mMrct2?aid=gzpxkdpddh&kid=hxhaaffkdag&clickid=%7Bclickid%7D&sub1=MiTel&sub2=Test_1&sub3=AdultDating&s2%7BofferId%7D%7BofferName%7D%7BofferNumber%7D%7Bregion%7D%7Bcountry%7D";
    const linksContainer = document.getElementById("links");
    const counter = document.getElementById("counter");

    // ৫০টি লিংক তৈরি
    for (let i = 1; i <= 50; i++) {

      const url = baseUrl.replace(
        "sub2=Test_1",
        "sub2=Test_" + i
      );

      const link = document.createElement("a");

      link.className = "link-btn";
      link.href = url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = "Link " + i;

      const storageKey = "clickedDatingLink_" + i;

      // আগে ক্লিক করা থাকলে সবুজ দেখাবে
      try {
        if (localStorage.getItem(storageKey) === "yes") {
          link.classList.add("clicked");
          link.textContent = "Link " + i + " ✓";
        }
      } catch (error) {
        // ব্রাউজারে স্টোরেজ বন্ধ থাকলেও লিংক কাজ করবে
      }

      // ক্লিক করলে সবুজ হবে
      link.addEventListener("click", function () {
        link.classList.add("clicked");
        link.textContent = "Link " + i + " ✓";

        try {
          localStorage.setItem(storageKey, "yes");
        } catch (error) {
          // স্টোরেজ উপলব্ধ না থাকলে বর্তমান পেজে রং থাকবে
        }
      });

      linksContainer.appendChild(link);
    }

    counter.textContent =
      "মোট " + linksContainer.children.length + "টি লিংক";
  </script>
</body>
</html>
