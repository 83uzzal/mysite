
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10121c">
  <title>Dating Links | Link Selector</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #10121c;
      color: #fff;
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      padding: 18px 8px;
    }

    .header h1 {
      font-size: 25px;
      margin: 0 0 10px;
      color: #ff6b91;
    }

    .header p {
      color: #c5c7d4;
      font-size: 14px;
      line-height: 1.6;
      margin: 0;
    }

    .counter {
      margin: 12px 0;
      padding: 12px;
      text-align: center;
      background: #202334;
      border-radius: 12px;
      font-size: 14px;
      color: #dfe1ee;
    }

    .links {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 54px;
      padding: 12px 6px;
      border-radius: 11px;
      background: #292d42;
      border: 1px solid #414760;
      color: white;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      -webkit-tap-highlight-color: transparent;
      transition: background .15s;
    }

    .link-btn:active {
      background: #e94f80;
      transform: scale(.98);
    }

    .footer {
      text-align: center;
      margin: 22px 0 10px;
      color: #9297aa;
      font-size: 12px;
      line-height: 1.7;
    }

    @media (min-width: 390px) {
      .links {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (min-width: 600px) {
      .links {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <header class="header">
      <h1>Dating Links</h1>
      <p>তোমার পছন্দের লিংকটি নির্বাচন করো</p>
    </header>

    <div class="counter" id="counter">
      মোট ৫০টি লিংক
    </div>

    <nav class="links" id="links" aria-label="Dating links">
    </nav>

    <footer class="footer">
      শুধুমাত্র ১৮ বছর বা তার বেশি বয়সীদের জন্য।<br>
      Continue করলে সংশ্লিষ্ট ওয়েবসাইটের নিয়ম প্রযোজ্য হবে।
    </footer>
  </main>

  <script>
    const baseUrl =
      "https://hotsexdatetoday.com/Qs8Kh1G3?aid=gzdakgbgzk&kid=hgfphpbahkx&clickid=%7Bclickid%7D&sub1=MiTel&sub2=Test_1&sub3=AdultDating&s2%7BofferId%7D%7BofferName%7D%7BofferNumber%7D%7Bregion%7D%7Bcountry%7D";

    const linksContainer = document.getElementById("links");
    const counter = document.getElementById("counter");

    const fragment = document.createDocumentFragment();

    for (let i = 1; i <= 50; i++) {
      const url = baseUrl.replace(
        "sub2=Test_1",
        `sub2=Test_${i}`
      );

      const link = document.createElement("a");

      link.className = "link-btn";
      link.href = url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = `Link ${i}`;
      link.setAttribute(
        "aria-label",
        `Open dating link Test ${i}`
      );

      fragment.appendChild(link);
    }

    linksContainer.appendChild(fragment);
    counter.textContent = `মোট ${linksContainer.children.length}টি লিংক`;
  </script>
</body>
</html>
