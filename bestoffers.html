
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10121c">

  <title>Dating Links - LollieFossell50086</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 14px;
      font-family: Arial, sans-serif;
      background: #10121c;
      color: #ffffff;
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      padding: 16px 5px;
    }

    .header h1 {
      color: #ff6b91;
      font-size: 25px;
      margin: 0 0 9px;
    }

    .header p {
      color: #c5c7d4;
      font-size: 14px;
      line-height: 1.5;
      margin: 0 0 5px;
    }

    .counter {
      background: #202334;
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .ipfighter-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 54px;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 11px;
      background: #ff6b91;
      border: 1px solid #ff8eaa;
      color: #ffffff;
      text-decoration: none;
      font-size: 15px;
      font-weight: bold;
      text-align: center;
    }

    .links {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 54px;
      padding: 12px 5px;
      border-radius: 11px;
      background: #292d42;
      border: 1px solid #414760;
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.2s, border-color 0.2s;
    }

    .link-btn.clicked {
      background: #168344;
      border-color: #4ade80;
    }

    .link-btn:active {
      opacity: 0.8;
    }

    .footer {
      text-align: center;
      margin: 22px 0 10px;
      color: #9297aa;
      font-size: 12px;
      line-height: 1.7;
    }

    .footer a {
      color: #ff8eaa;
      text-decoration: none;
    }

    @media (min-width: 390px) {
      .links {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (min-width: 600px) {
      .links {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <header class="header">
      <h1>Dating Links</h1>
      <p>LollieFossell50086</p>
      <p>লিংকে ক্লিক করো। ক্লিক করা লিংক সবুজ হয়ে থাকবে।</p>
    </header>

    <div class="counter" id="counter">
      মোট ৫০টি লিংক
    </div>

    <a
      class="ipfighter-btn"
      href="https://ipfighter.com/"
      target="_blank"
      rel="noopener noreferrer"
    >
      Open IP Fighter
    </a>

    <nav class="links" id="links" aria-label="Dating links">
    </nav>

    <footer class="footer">
      শুধুমাত্র ১৮ বছর বা তার বেশি বয়সীদের জন্য।<br>
      Contact:
      <a href="mailto:davismiya874@gmail.com">
        davismiya874@gmail.com
      </a>
    </footer>

  </main>

  <script>
    // Your New Base URL
    const baseUrl =
      "https://luckynowforever.com/d3RpR4rr?aid=hbfdhpxbxg&kid=hpgxagagxzb";

    const linksContainer = document.getElementById("links");
    const counter = document.getElementById("counter");

    // Create 50 unique links
    for (let i = 1; i <= 50; i++) {

      const url = new URL(baseUrl);

      // Unique tracking parameter
      url.searchParams.set("sub2", "Test_1_" + i);

      const link = document.createElement("a");

      link.className = "link-btn";
      link.href = url.toString();
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = "Link " + i;

      const storageKey = "clickedDatingLink_" + i;

      // Restore previously clicked links
      try {
        if (localStorage.getItem(storageKey) === "yes") {
          link.classList.add("clicked");
          link.textContent = "Link " + i + " ✓";
        }
      } catch (error) {}

      // Mark clicked link green
      link.addEventListener("click", function () {

        link.classList.add("clicked");
        link.textContent = "Link " + i + " ✓";

        try {
          localStorage.setItem(storageKey, "yes");
        } catch (error) {}

      });

      linksContainer.appendChild(link);
    }

    // Update total count
    counter.textContent =
      "মোট " + linksContainer.children.length + "টি লিংক";

  </script>

</body>
</html>
