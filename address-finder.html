
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Address Finder</title>

<style>
/* ---------- Soft Gradient Background ---------- */
body {
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
    min-height: 100vh;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    
    background: linear-gradient(135deg, #1f2937, #374151);
    color: #1f2937;
}

/* ---------- Main Container ---------- */
.container {
    background: #ffffff;
    padding: 36px;
    border-radius: 16px;

    width: 100%;
    max-width: 700px;

    box-shadow: 0 18px 40px rgba(0,0,0,0.25);

    margin: 20px;
}


/* ---------- Heading ---------- */
h1 {
    text-align: center;
    margin-bottom: 26px;
    font-size: 24px;
    font-weight: 700;
    color: #111827;
}

/* ---------- Form ---------- */
.lookup-form {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

#ipInput {
    flex: 1;
    padding: 14px;
    font-size: 16px;
    border-radius: 10px;
    border: 1px solid #d1d5db;
    background: #ffffff;
    color: #111827;
}

#ipInput::placeholder {
    color: #6b7280;
}

#ipInput:focus {
    outline: none;
    border-color: #4f46e5;
    box-shadow: 0 0 0 1px #4f46e5;
}

/* ---------- Buttons ---------- */
.lookup-btn {
    padding: 14px 24px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #4f46e5, #6366f1);
    color: #ffffff;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s ease;
}

.lookup-btn:hover {
    opacity: 0.9;
}

/* ---------- Messages ---------- */
#loading,
#errorMessage,
#resultData {
    display: none;
}

#loading {
    text-align: center;
    color: #2563eb;
    font-weight: 600;
}

#errorMessage {
    background: #fee2e2;
    color: #b91c1c;
    padding: 14px;
    border-radius: 10px;
}

/* ---------- Result ---------- */
.data-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 0;
    border-bottom: 1px solid #e5e7eb;
}

.data-label {
    font-weight: 600;
    color: #374151;
    min-width: 120px;
}

.data-value {
    flex: 1;
    margin-right: 10px;
    word-break: break-word;
    color: #111827;
}

/* ---------- Copy Buttons ---------- */
.copy-btn {
    padding: 6px 14px;
    border-radius: 8px;
    border: 1px solid #d1d5db;
    background: #f9fafb;
    cursor: pointer;
    font-weight: 600;
    color: #111827;
}

.copy-btn:hover {
    background: #f3f4f6;
}

/* ---------- Copy All Button ---------- */
#copyAllBtn {
    margin-top: 22px;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #22c55e, #4ade80);
    color: #ffffff;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
}

#copyAllBtn:hover {
    opacity: 0.9;
}
@media (max-width: 600px) {
    /* Container becomes more compact */
    .container {
        padding: 18px;
        margin: 12px;
        border-radius: 12px;
    }

    /* Heading tighter */
    h1 {
        margin-bottom: 16px;
        font-size: 20px;
    }

    /* Form spacing reduced */
    .lookup-form {
        gap: 8px;
        margin-bottom: 14px;
    }

    #ipInput {
        padding: 12px;
        font-size: 14px;
    }

    .lookup-btn {
        padding: 12px;
        font-size: 14px;
    }

    /* Result rows tighter */
    .data-item {
        padding: 10px 0;
    }

    .data-label {
        min-width: 90px;
        font-size: 14px;
    }

    .data-value {
        font-size: 14px;
    }

    .copy-btn {
        padding: 5px 10px;
        font-size: 13px;
    }

    /* Copy all button smaller */
    #copyAllBtn {
        padding: 12px;
        font-size: 14px;
        margin-top: 16px;
    }
}



</style>
</head>

<body>

<div class="container">
<h1>Address Finder</h1>

<form id="lookupForm" class="lookup-form">
    <input type="text" id="ipInput" placeholder="Enter IP (leave empty for your IP)">
    <button class="lookup-btn">Lookup</button>
</form>

<p id="loading">Fetching IP data...</p>
<p id="errorMessage"></p>

<div id="resultData">
    <div class="data-item">
        <span class="data-label">First Name:</span>
        <span id="first-name-value" class="data-value"></span>
        <button class="copy-btn" data-copy="first-name-value">Copy</button>
    </div>

    <div class="data-item">
        <span class="data-label">Last Name:</span>
        <span id="last-name-value" class="data-value"></span>
        <button class="copy-btn" data-copy="last-name-value">Copy</button>
    </div>


    <div class="data-item">
        <span class="data-label">Email:</span>
        <span id="email-value" class="data-value"></span>
        <button class="copy-btn" data-copy="email-value">Copy</button>
    </div>


    <div class="data-item">
        <span class="data-label">Street:</span>
        <span id="street-value" class="data-value"></span>
        <button class="copy-btn" data-copy="street-value">Copy</button>
    </div>

    <div class="data-item">
        <span class="data-label">Postal:</span>
        <span id="postal-value" class="data-value"></span>
        <button class="copy-btn" data-copy="postal-value">Copy</button>
    </div>

    <div class="data-item">
        <span class="data-label">City:</span>
        <span id="city-value" class="data-value"></span>
        <button class="copy-btn" data-copy="city-value">Copy</button>
    </div>

    <div class="data-item">
        <span class="data-label">State:</span>
        <span id="state-value" class="data-value"></span>
        <button class="copy-btn" data-copy="state-value">Copy</button>
    </div>

    <div class="data-item">
        <span class="data-label">Country:</span>
        <span id="country-value" class="data-value"></span>
        <button class="copy-btn" data-copy="country-value">Copy</button>
    </div>

    <!-- <div class="data-item">
        <span class="data-label">ISP:</span>
        <span id="isp-value" class="data-value"></span>
        <button class="copy-btn" data-copy="isp-value">Copy</button>
    </div> -->

    <div class="data-item">
        <span class="data-label">Phone:</span>
        <span id="phone-value" class="data-value"></span>
        <button class="copy-btn" data-copy="phone-value">Copy</button>
    </div>

    <button id="copyAllBtn">Copy All</button>
</div>
</div>

}


    // Address gen
    
const generatedAddresses = new Set();


function realisticHouseNumber() {

  const r = Math.random();

  if (r < 0.55) return Math.floor(Math.random() * 900 + 100);     // 100–999 most common
  if (r < 0.85) return Math.floor(Math.random() * 3000 + 1000);   // 1000–3999 common
  if (r < 0.97) return Math.floor(Math.random() * 3000 + 4000);   // 4000–6999 less common
  return Math.floor(Math.random() * 2000 + 7000);                 // rare high numbers
}


function maybeUnit() {

  const r = Math.random();

  if (r < 0.12) return ` Apt ${Math.floor(Math.random()*40+1)}`;
  if (r < 0.16) return ` Unit ${Math.floor(Math.random()*60+1)}`;
  if (r < 0.19) return ` Suite ${Math.floor(Math.random()*800+100)}`;

  return "";
}

    

    function generateUltraRealAddress(city, state, postal) {

  let address;

  do {

    const houseNumber = realisticHouseNumber();
    const street = rand(streets);
    const unit = maybeUnit();

    address = `${houseNumber} ${street}${unit}, ${city} ${state} ${postal}`;

  } while (generatedAddresses.has(address));

  generatedAddresses.add(address);

  return address;
}

function maybeNickname(name) {
  const lower = name.toLowerCase();
  if (nicknameMap[lower] && Math.random() < 0.25) {
    return nicknameMap[lower];
  }
  return lower;
}

function smartNumber() {
  const r = Math.random();
  if (r < 0.3) return "";              // no number
  if (r < 0.55) return Math.floor(Math.random() * 90 + 10);   // 2-digit (92)
  if (r < 0.75) return Math.floor(Math.random() * 9 + 1);     // single digit (7)
  if (r < 0.9) return Math.floor(Math.random() * 30 + 1985);  // birth year (1985–2015)
  return Math.floor(Math.random() * 900 + 100);               // fallback small 3-digit
}

function cleanSeparators(str) {
  return str
    .replace(/\.{2,}/g, ".")
    .replace(/_{2,}/g, "_")
    .replace(/[._]+$/g, "")
    .replace(/^[._]+/g, "");
}

function maybeHumanCase(str) {
  // Mostly lowercase. Rarely Capitalize first char.
  if (Math.random() < 0.12) {
    return str.charAt(0).toUpperCase() + str.slice(1);
  }
  return str.toLowerCase();
}



const rand = arr => arr[Math.floor(Math.random() * arr.length)];
const fakeStreet = () => Math.floor(Math.random()*900+100) + " " + rand(streets);
const fakePhone = () => {
    const areaCode = Math.floor(Math.random() * 800) + 200; // 200–999
    const exchange = Math.floor(Math.random() * 800) + 200; // 200–999

    let line;
    do {
        line = Math.floor(Math.random() * 9000) + 1000;
    } while (/(\d)\1{3}/.test(line)); // avoid 1111, 2222, etc.

    return `${areaCode}${exchange}${line}`;
};
const usPhoneRegex =
/^\(?[2-9][0-9]{2}\)?[\s.-]?[2-9][0-9]{2}[\s.-]?[0-9]{4}$/;


/* ---------- Email Generator ---------- */
const emailDomains = [
    "gmail.com",
    "outlook.com"
];

const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

function randomCase(str) {
    return str
        .split("")
        .map(ch => Math.random() > 0.5 ? ch.toUpperCase() : ch.toLowerCase())
        .join("");
}

function generateAdvancedEmail(firstName, lastName) {
  let first = maybeNickname(firstName);
  let last = lastName.toLowerCase();

  const domain = rand(emailDomains);
  const num = smartNumber();

  let base = "";

  const r = Math.random();

  // Gmail-style + realistic patterns
  if (r < 0.35) {
    // firstname.lastname
    base = `${first}.${last}`;
  } else if (r < 0.55) {
    // firstnamelastname
    base = `${first}${last}`;
  } else if (r < 0.7) {
    // f.lastname (rare-ish)
    base = `${first[0]}.${last}`;
  } else if (r < 0.82) {
    // firstname.l
    base = `${first}.${last[0]}`;
  } else if (r < 0.9) {
    // firstname_lastname (non-gmail style)
    base = `${first}_${last}`;
  } else {
    // VERY rare: initial + last (low probability)
    base = `${first[0]}${last}`;
  }

  base = cleanSeparators(base);

  let finalBase = base + num;

  // Length limits (human-like)
  if (finalBase.length > 20) {
    finalBase = finalBase.slice(0, 20);
  }

  finalBase = maybeHumanCase(finalBase);

  const email = `${finalBase}@${domain}`;

  return emailRegex.test(email) ? email : "N/A";
}
