           VARIABLES

        :root {

        /* =========================================
           RESET & BASE STYLES
        ========================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            width: 100%;
            min-height: 100%;
        }

        body {
            width: 100%;
            min-height: 100vh;
            color: var(--text);
            background: 
                radial-gradient(circle at top left, rgba(99, 102, 241, 0.16), transparent 35%),
                radial-gradient(circle at bottom right, rgba(244, 63, 94, 0.10), transparent 35%),
                linear-gradient(135deg, var(--bg-dark), var(--bg), var(--bg-light));
            display: flex;
            flex-direction: column;
            padding-bottom: 80px; /* Ensures footer and bottom offers are visible */
        }

        /* =========================================
           HEADER
        ========================================= */
        .header {
            width: 100%;
            text-align: center;
            padding: calc(18px + env(safe-area-inset-top)) 15px 15px;
        }

        .header h1 {
            font-size: clamp(1.3rem, 5.5vw, 1.85rem);
            line-height: 1.25;
            font-weight: 800;
            margin-bottom: 6px;
            background: linear-gradient(90deg, #818cf8, #c084fc, #f472b6);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--muted);
            font-size: clamp(0.75rem, 3vw, 0.88rem);
            line-height: 1.4;
        }

        /* =========================================
           MAIN CONTAINER
        ========================================= */
        .container {
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
            padding: 0 12px 30px;
            flex: 1 0 auto;
        }

        /* =========================================
           TABS WRAPPER
        ========================================= */
        .tabs-container {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px;
            margin-bottom: 15px;
            background: rgba(0, 0, 0, 0.30);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .tabs-container::-webkit-scrollbar {
            display: none;
        }

        /* =========================================
           TAB BUTTON
        ========================================= */
        .tab-btn {
            flex: 0 0 auto;
            min-width: 100px;
            padding: 10px 12px;
            border-radius: 9px;
            text-align: center;
            color: rgba(255, 255, 255, 0.68);
            font-size: 0.72rem;
            font-weight: 700;
            line-height: 1.2;
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.06);
        }

        .tab-btn.active {
            color: #fff;
            background: linear-gradient(135deg, var(--primary), #4f46e5);
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.30);
        }

        .tab-btn:active {
            transform: scale(0.96);
        }

        /* =========================================
           TAB CONTENT
        ========================================= */
        .tab-content {
            display: none;
            width: 100%;
            animation: fadeIn 0.25s ease;
            padding-bottom: 20px;
        }

        .tab-content.active {
            display: block;
        }

        /* =========================================
           OFFER CARD
        ========================================= */
        .offer-card {
            width: 100%;
            min-height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 9px;
            padding: 11px 12px;
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.86), rgba(30, 41, 59, 0.68));
            border: 1px solid var(--border);
            border-radius: 13px;
            color: #fff;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: transform 0.15s ease, border-color 0.2s ease, background 0.2s ease;
        }

        .offer-card::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: linear-gradient(to bottom, var(--primary), var(--accent));
            opacity: 0.65;
        }

        .offer-card:hover {
            border-color: rgba(129, 140, 248, 0.55);
            background: rgba(38, 51, 74, 0.90);
            transform: translateY(-1px);
        }

        .offer-card:active {
            transform: scale(0.985);
        }

        /* =========================================
           LEFT CONTENT
        ========================================= */
        .card-left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex: 1;
        }

        /* =========================================
           ICON
        ========================================= */
        .icon-box {
            width: 38px;
            height: 38px;
            min-width: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.22), rgba(129, 140, 248, 0.10));
            color: var(--primary-light);
            font-size: 15px;
            border: 1px solid rgba(129, 140, 248, 0.10);
        }

           OFFER INFORMATION
        ========================================= */
        .offer-info {
            min-width: 0;
            flex: 1;
        }

        .offer-title {
            width: 100%;
            font-size: clamp(0.76rem, 3.2vw, 0.85rem);
            font-weight: 650;
            line-height: 1.35;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .offer-sub {
            margin-top: 2px;
            font-size: clamp(0.62rem, 2.7vw, 0.68rem);
            line-height: 1.2;
            color: rgba(255, 255, 255, 0.50);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* =========================================
           CLAIM BUTTON
        ========================================= */
        .btn-claim {

            padding: 7px 12px;

            background: linear-gradient(135deg, var(--accent), #e11d48);
            color: #fff;

            font-weight: 800;
            letter-spacing: 0.3px;
            white-space: nowrap;
            box-shadow: 0 4px 12px rgba(244, 63, 94, 0.25);
            animation: pulse 2.2s infinite;
            pointer-events: none;
        }

           FOOTER STYLES
        ========================================= */

        .footer-text {

            font-size: 0.70rem;
            line-height: 1.5;
        }

        /* =========================================
           ANIMATIONS
        ========================================= */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(4px);
            }
            to {

                transform: translateY(0);
            }

        @keyframes pulse {

    </style>

            }
