        ========================================= */

        :root {
            --primary: #6366f1;
            --primary-light: #818cf8;

            --accent: #f43f5e;
            --accent-light: #fb7185;

            --bg-dark: #0b1120;
            --bg: #0f172a;
            --bg-light: #1e293b;

            --card: rgba(30, 41, 59, 0.78);

            --border: rgba(255, 255, 255, 0.09);

            --text: #ffffff;
            --muted: rgba(255, 255, 255, 0.60);
        }


        /* =========================================
           RESET
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;
        }


        html {
            width: 100%;
            min-height: 100%;

            overflow-x: hidden;
            overflow-y: auto;

            scroll-behavior: smooth;
        }


        body {
            width: 100%;

            min-height: 100vh;
            min-height: 100dvh;

            color: var(--text);

            background:
                radial-gradient(
                    circle at top left,
                    rgba(99, 102, 241, 0.16),
                    transparent 35%
                ),

                radial-gradient(
                    circle at bottom right,
                    rgba(244, 63, 94, 0.10),
                    transparent 35%
                ),

                linear-gradient(
                    135deg,
                    var(--bg-dark),
                    var(--bg),
                    var(--bg-light)
                );

            overflow-x: hidden;
            overflow-y: auto;

            -webkit-overflow-scrolling: touch;

            padding-bottom:
                calc(40px + env(safe-area-inset-bottom));
        }


        /* =========================================
           HEADER
        ========================================= */

        .header {
            width: 100%;

            text-align: center;

            padding:
                calc(22px + env(safe-area-inset-top))
                15px
                18px;
        }


        .header h1 {
            font-size:
                clamp(1.35rem, 6vw, 1.85rem);

            line-height: 1.25;

            font-weight: 800;

            margin-bottom: 7px;

            background:
                linear-gradient(
                    90deg,
                    #818cf8,
                    #c084fc,
                    #f472b6
                );

            -webkit-background-clip: text;
            background-clip: text;

            -webkit-text-fill-color: transparent;
        }


        .header p {
            color: var(--muted);

            font-size:
                clamp(0.72rem, 3.2vw, 0.85rem);

            line-height: 1.4;
        }


        /* =========================================
           MAIN CONTAINER
        ========================================= */

        .container {
            width: 100%;

            max-width: 520px;

            margin:
                0 auto;

            padding:
                0 10px
                calc(35px + env(safe-area-inset-bottom));
        }


        /* =========================================
           TABS WRAPPER
        ========================================= */

        .tabs-container {
            width: 100%;

            display: flex;

            align-items: center;

            gap: 6px;

            padding: 5px;

            margin-bottom: 15px;

            background:
                rgba(0, 0, 0, 0.30);

            border:
                1px solid
                rgba(255,255,255,0.05);

            border-radius: 14px;

            overflow-x: auto;
            overflow-y: hidden;

            -webkit-overflow-scrolling: touch;

            scrollbar-width: none;
        }


        .tabs-container::-webkit-scrollbar {
            display: none;
        }


        /* =========================================
           TAB BUTTON
        ========================================= */

        .tab-btn {
            flex:
                0 0 auto;

            min-width: 105px;

            padding:
                10px
                11px;

            border-radius: 9px;

            text-align: center;

            color:
                rgba(255,255,255,0.68);

            font-size: 0.72rem;

            font-weight: 700;

            line-height: 1.2;

            white-space: nowrap;

            cursor: pointer;

            user-select: none;

            transition:
                all 0.2s ease;
        }


        .tab-btn:hover {
            color: #fff;

            background:
                rgba(255,255,255,0.06);
        }


        .tab-btn.active {
            color: #fff;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    #4f46e5
                );

            box-shadow:
                0 4px 14px
                rgba(99,102,241,0.30);
        }


        .tab-btn:active {
            transform:
                scale(0.96);
        }


        /* =========================================
           TAB CONTENT
        ========================================= */

        .tab-content {
            display: none;

            width: 100%;

            animation:
                fadeIn
                0.25s
                ease;
        }


        .tab-content.active {
            display: block;
        }


        /* =========================================
           OFFER CARD
        ========================================= */

        .offer-card {
            width: 100%;

            min-height: 64px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 9px;

            margin-bottom: 9px;

            padding:
                11px;

            background:
                linear-gradient(
                    135deg,
                    rgba(30,41,59,0.86),
                    rgba(30,41,59,0.68)
                );

            border:
                1px solid
                var(--border);

            border-radius: 13px;

            color: #fff;

            cursor: pointer;

            position: relative;

            overflow: hidden;

            backdrop-filter:
                blur(12px);

            -webkit-backdrop-filter:
                blur(12px);

            transition:
                transform 0.15s ease,
                border-color 0.2s ease,
                background 0.2s ease;
        }


        .offer-card::before {
            content: "";

            position: absolute;

            left: 0;
            top: 0;
            bottom: 0;

            width: 2px;

            background:
                linear-gradient(
                    to bottom,
                    var(--primary),
                    var(--accent)
                );

            opacity: 0.55;
        }


        .offer-card:hover {
            border-color:
                rgba(129,140,248,0.55);

            background:
                rgba(38,51,74,0.90);

            transform:
                translateY(-1px);
        }


        .offer-card:active {
            transform:
                scale(0.985);
        }


        /* =========================================
           LEFT CONTENT
        ========================================= */

        .card-left {
            display: flex;

            align-items: center;

            gap: 10px;

            min-width: 0;

            flex: 1;
        }


        /* =========================================
           ICON
        ========================================= */

        .icon-box {
            width: 38px;
            height: 38px;

            min-width: 38px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    rgba(99,102,241,0.22),
                    rgba(129,140,248,0.10)
                );

            color:
                var(--primary-light);

            font-size: 15px;

            border:
                1px solid
                rgba(129,140,248,0.10);
        }


        /* =========================================
           OFFER INFORMATION
        ========================================= */

        .offer-info {
            min-width: 0;

            flex: 1;
        }


        .offer-title {
            width: 100%;

            font-size:
                clamp(0.76rem, 3.2vw, 0.84rem);

            font-weight: 650;

            line-height: 1.3;

            color: #fff;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        .offer-sub {
            margin-top: 3px;

            font-size:
                clamp(0.61rem, 2.7vw, 0.68rem);

            line-height: 1.2;

            color:
                rgba(255,255,255,0.48);

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        /* =========================================
           CLAIM BUTTON
        ========================================= */

        .btn-claim {
            flex:
                0 0 auto;

            padding:
                7px
                11px;

            border-radius: 20px;

            background:
                linear-gradient(
                    135deg,
                    var(--accent),
                    #e11d48
                );

            color: #fff;

            font-size:
                0.62rem;

            font-weight: 800;

            letter-spacing:
                0.2px;

            white-space: nowrap;

            box-shadow:
                0 4px 12px
                rgba(244,63,94,0.25);

            animation:
                pulse 2.2s
                infinite;

            pointer-events: none;
        }


        /* =========================================
           EMPTY MESSAGE
        ========================================= */

        .empty-message {
            text-align: center;

            padding:
                35px 15px;

            color:
                rgba(255,255,255,0.5);

            font-size:
                0.82rem;
        }


        /* =========================================
           ANIMATION
        ========================================= */

        @keyframes fadeIn {

            from {
                opacity: 0;

                transform:
                    translateY(5px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        @keyframes pulse {

            0% {
                box-shadow:
                    0 0 0 0
                    rgba(244,63,94,0.35);
            }

            70% {
                box-shadow:
                    0 0 0 6px
                    rgba(244,63,94,0);
            }

            100% {
                box-shadow:
                    0 0 0 0
                    rgba(244,63,94,0);
            }
        }

           MOBILE - 480px
        ========================================= */

        /* =========================================
           ESCAPE HTML
        ========================================= */

        function escapeHTML(value) {

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /* =========================================
           OPEN OFFER
        ========================================= */

        function openOffer(url) {

            if (!url) return;

            window.open(
                url,
                "_blank",
                "noopener,noreferrer"
            );
        }


        /* =========================================
           RENDER OFFERS
        ========================================= */

        function render() {

            Object.keys(data).forEach(panel => {

                const container =
                    document.getElementById(panel);

                if (!container) return;


                container.innerHTML = "";


                data[panel].forEach(offer => {

                    const title = offer[0];
                    const url = offer[1];


                    const card =
                        document.createElement("div");


                    card.className =
                        "offer-card";


                    card.setAttribute(
                        "role",
                        "link"
                    );


                    card.setAttribute(
                        "tabindex",
                        "0"
                    );


                    card.innerHTML = `

                        <div class="card-left">

                            <div class="icon-box">

                                <i
                                    class="fas fa-gift"
                                    aria-hidden="true"
                                ></i>

                            </div>


                            <div class="offer-info">

                                <div class="offer-title">
                                    ${escapeHTML(title)}
                                </div>

                                <div class="offer-sub">
                                    Limited Time Offer
                                </div>

                            </div>

                        </div>


                        <div class="btn-claim">
                            CLAIM
                        </div>

                    `;


                    /* Click */

                    card.addEventListener(
                        "click",
                        function() {

                            openOffer(url);

                        }
                    );


                    /* Keyboard */

                    card.addEventListener(
                        "keydown",
                        function(event) {

                            if (
                                event.key === "Enter" ||
                                event.key === " "
                            ) {

                                event.preventDefault();

                                openOffer(url);

                            }

                        }
                    );


                    container.appendChild(card);

                });

            });

        }


        /* =========================================
           SWITCH TAB
        ========================================= */

        function switchTab(id, button) {

            document
                .querySelectorAll(".tab-content")
                .forEach(content => {

                    content.classList.remove(
                        "active"
                    );

                });


            document
                .querySelectorAll(".tab-btn")
                .forEach(tab => {

                    tab.classList.remove(
                        "active"
                    );

                });


            const selectedContent =
                document.getElementById(id);


            if (selectedContent) {

                selectedContent.classList.add(
                    "active"
                );

            }


            if (button) {

                button.classList.add(
                    "active"
                );


                /*
                 * On mobile, automatically
                 * bring selected tab into view.
                 */

                if (window.innerWidth < 768) {

                    button.scrollIntoView({
                        behavior: "smooth",
                        block: "nearest",
                        inline: "center"
                    });

                }

            }

        }


        /* =========================================
           TAB CLICK EVENTS
        ========================================= */

        document
            .querySelectorAll(".tab-btn")
            .forEach(button => {


                button.addEventListener(
                    "click",
                    function() {

                        switchTab(
                            this.dataset.tab,
                            this
                        );

                    }
                );


                button.addEventListener(
                    "keydown",
                    function(event) {

                        if (
                            event.key === "Enter" ||
                            event.key === " "
                        ) {

                            event.preventDefault();

                            switchTab(
                                this.dataset.tab,
                                this
                            );

                        }

                    }
                );

            });


        /* =========================================
           INITIALIZE
        ========================================= */

        render();

    </script>
