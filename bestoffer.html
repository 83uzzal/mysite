<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exclusive Offers</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZFYWLM9B1C"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-ZFYWLM9B1C');
    </script>
    <style>
        :root {
            --primary: #6366f1;
            --accent: #f43f5e;
            --bg: #0f172a;
            --card: rgba(30, 41, 59, 0.7);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { 
            background: linear-gradient(135deg, var(--bg), #1e293b); 
            color: #fff; 
            padding-bottom: 30px; 
            min-height: 100vh;
        }
        
        .header { text-align: center; padding: 30px 15px 20px; }
        .header h1 { 
            font-size: clamp(1.4rem, 5vw, 1.8rem); 
            margin-bottom: 6px; 
            background: linear-gradient(to right, #818cf8, #f472b6); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }
        
        .container { max-width: 500px; margin: 0 auto; padding: 0 12px; }
        
        .tabs-container { 
            display: flex; 
            gap: 8px; 
            background: rgba(0,0,0,0.3); 
            padding: 6px; 
            border-radius: 12px; 
            margin-bottom: 16px; 
        }
        .tab-btn { 
            flex: 1; 
            padding: 12px 8px; 
            cursor: pointer; 
            text-align: center; 
            border-radius: 8px; 
            font-size: 0.85rem; 
            font-weight: 600; 
            transition: 0.3s; 
            word-break: break-word;
        }
        .tab-btn.active { background: var(--primary); }
        
        .tab-content { display: none; animation: fadeIn 0.4s; }
        .tab-content.active { display: block; }
        
        .offer-card { 
            background: var(--card); 
            backdrop-filter: blur(10px); 
            border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 14px; 
            padding: 14px; 
            margin-bottom: 10px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            text-decoration: none; 
            color: white; 
            transition: 0.2s; 
            gap: 10px;
        }
        .offer-card:active { transform: scale(0.98); }
        .offer-card:hover { border-color: var(--primary); }
        
        .card-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .icon-box { 
            width: 38px; 
            height: 38px; 
            flex-shrink: 0;
            background: rgba(99, 102, 241, 0.2); 
            color: #818cf8; 
            border-radius: 10px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .offer-title {
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .offer-sub { font-size: 0.7rem; opacity: 0.6; margin-top: 2px; }
        
        .btn-claim { 
            background: var(--accent); 
            padding: 8px 14px; 
            border-radius: 20px; 
            font-size: 0.7rem; 
            font-weight: bold; 
            flex-shrink: 0;
            box-shadow: 0 4px 15px rgba(244, 63, 94, 0.3); 
            animation: pulse 2s infinite; 
        }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.4); } 70% { box-shadow: 0 0 0 8px rgba(244, 63, 94, 0); } 100% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0); } }
    </style>
</head>
<body>

<div class="header">
    <h1>🔥 Trending Rewards</h1>
    <p style="font-size: 0.85rem; opacity: 0.7;">Select your prize below</p>
</div>

<div class="container">
    <div class="tabs-container">
        <div class="tab-btn active" onclick="switchTab(event, 'Adblumedia_Panel_New02')">Panel New02</div>
        <div class="tab-btn" onclick="switchTab(event, 'Adblumedia_Panel_New03')">Panel New03</div>
        <div class="tab-btn" onclick="switchTab(event, 'Adblumedia_Panel_New05')">Panel New05</div>
    </div>

    <div id="Adblumedia_Panel_New02" class="tab-content active"></div>
    <div id="Adblumedia_Panel_New03" class="tab-content"></div>
    <div id="Adblumedia_Panel_New05" class="tab-content"></div>
</div>

<script>
    const data = {
        Adblumedia_Panel_New02: [
                ["RTO USA (SOI)", "https://track.offersbounty.com//tr?offer_id=21&aff_id=292"],
             ["Huggies - SOI - US Only", "https://track.offersbounty.com//tr?offer_id=15&aff_id=292"],
  ["Walmart Bonus $750", "https://mathnixadvertising871.o18.click/c?o=21832079&m=4818&a=723601&aff_click_id={replace_it}&sub_aff_id={replace_it}&aff_sub1={Lead Hunter-10}"],
            ["Rewards US - Cash $1000", "https://mathnixadvertising871.o18.click/c?o=21832071&m=4818&a=723601&aff_click_id={replace_it}&sub_aff_id={replace_it}&aff_sub1={Lead Hunter-10}"]

        ],
        Adblumedia_Panel_New03: [
    ["Win Amazon $1000 Gift Card", "https://app.hawktrk.com/click?pid=2&offer_id=22011&sub2=u810316&sub5=Hunter-10"],
    ["Paypal 100", "https://app.hawktrk.com/click?pid=2&offer_id=576&sub2=u810316&sub5=Hunter-10"],
            ["Aus-Amazon $500 ", "https://app.hawktrk.com/click?pid=2&offer_id=23587&sub2=u810316&sub5=Hunter-10"],
            ["Po-Biedronka Gift Card ", "https://app.hawktrk.com/click?pid=2&offer_id=15613&sub2=u810316&sub5=Hunter-10"],
    ["Chick Fil A 100", "https://app.hawktrk.com/click?pid=2&offer_id=7&sub2=u810316&sub5=Hunter-10"],
    ["TJ Maxx GiftCard", "https://app.hawktrk.com/click?pid=2&offer_id=23615&sub2=u810316&sub5=Hunter-10"],
    ["PrizeZappy - $50K", "https://app.hawktrk.com/click?pid=2&offer_id=18251&sub2=u810316&sub5=Hunter-10"],
    ["Lululemon GiftCard", "https://app.hawktrk.com/click?pid=2&offer_id=15720&sub2=u810316&sub5=Hunter-10"],
    ["Cash App $1000", "https://app.hawktrk.com/click?pid=2&offer_id=21684&sub2=u810316&sub5=Hunter-10"],
    ["CashApp 750", "https://app.hawktrk.com/click?pid=2&offer_id=11788&sub2=u810316&sub5=Hunter-10"],
    ["$100 Jersey Mikes", "https://app.hawktrk.com/click?pid=2&offer_id=21856&sub2=u810316&sub5=Hunter-10"],
    ["Taco Bell 100", "https://app.hawktrk.com/click?pid=2&offer_id=23755&sub2=u810316&sub5=Hunter-10"],
    ["Amazon Gift Card", "https://app.hawktrk.com/click?pid=2&offer_id=21737&sub2=u810316&sub5=Hunter-10"],
    ["Grocery Gift Card", "https://app.hawktrk.com/click?pid=2&offer_id=21494&sub2=u810316&sub5=Hunter-10"],
    ["Adidas Gift Card", "https://app.hawktrk.com/click?pid=2&offer_id=16067&sub2=u810316&sub5=Hunter-10"],
    ["Nike GiftCard", "https://app.hawktrk.com/click?pid=2&offer_id=14565&sub2=u810316&sub5=Hunter-10"]
        ],
        Adblumedia_Panel_New05: [
    ["iMON_1", "https://paysale.g2afse.com/click?pid=137487&offer_id=7852&sub1=Hunter-10"],
    ["iMON_2", "https://paysale.g2afse.com/click?pid=137169&offer_id=7852&sub1=Hunter-10"]
        ]
    };

    function render() {
        for (let p in data) {
            const element = document.getElementById(p);
            if(element) {
                element.innerHTML = data[p].map(o => `
                    <a href="${o[1]}" class="offer-card" target="_blank" rel="noopener">
                        <div class="card-left">
                            <div class="icon-box"><i class="fas fa-gift"></i></div>
                            <div style="min-width:0;">
                                <div class="offer-title">${o[0]}</div>
                                <div class="offer-sub">Limited Time Offer</div>
                            </div>
                        </div>
                        <div class="btn-claim">CLAIM</div>
                    </a>`).join('');
            }
        }
    }
    
    function switchTab(e, id) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        e.currentTarget.classList.add('active');
    }
    
    render();
</script>
</body>
</html>
